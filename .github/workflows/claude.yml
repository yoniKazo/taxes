name: Claude Code

on:
  pull_request:
    paths:
      - "tax-copilot/**"
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: tax-copilot
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: tax-copilot
        run: pytest

  claude:
    # Requires secrets.ANTHROPIC_API_KEY. Guarded so the workflow doesn't
    # fail red on every PR before the secret exists (S6, tracked as
    # written-not-run until the key is added).
    if: ${{ (github.event_name == 'pull_request' || contains(github.event.comment.body, '@claude')) && secrets.ANTHROPIC_API_KEY != '' }}
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
